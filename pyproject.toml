[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "hf-py-sdk"
dynamic = ["version"]
description = "Typed async Python client for the HyperFlow GraphQL API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["hyperflow", "graphql", "client", "sdk", "ethereum"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # ariadne-codegen 0.19 builds list-based ASTs that graphql-core 3.3 rejects.
    "graphql-core>=3.2,<3.3",
]

[project.optional-dependencies]
# The generated transport needs the asyncio websockets client (15.0+).
subscriptions = ["websockets>=15"]

[project.urls]
Homepage = "https://hyperflowlabs.com"
Source = "https://github.com/hyperflowfinance/hf-py-sdk"

[dependency-groups]
# Pinned: generated code must match the version tested in CI before release.
codegen = ["ariadne-codegen==0.19.0"]

# Version is derived from git tags (e.g. v1.2.3 -> 1.2.3).
[tool.hatch.version]
source = "vcs"

# The package is generated and gitignored, so force-include it in the build.
[tool.hatch.build]
artifacts = ["src/hyperflow/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperflow"]

[tool.hatch.build.targets.sdist]
include = ["src/hyperflow", "codegen", "README.md", "LICENSE"]
