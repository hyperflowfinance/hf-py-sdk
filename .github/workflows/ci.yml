name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for hatch-vcs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codegen
        run: pip install "ariadne-codegen==0.19.0" build

      - name: Generate client from live schema
        run: python codegen/generate.py
        env:
          HYPERFLOW_AUTH_HEADER: ${{ vars.HYPERFLOW_AUTH_HEADER }}
          HYPERFLOW_AUTH_VALUE: ${{ secrets.HYPERFLOW_AUTH_VALUE }}

      - name: Build wheel
        run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-wheel
          path: dist/*.whl

  test:
    needs: build-client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            deps: >-
              "graphql-core==3.2.*" "httpx==0.27.*" "pydantic==2.7.*" "websockets==15.0"
          - python: "3.13"
            deps: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: sdk-wheel
          path: dist

      - name: Install built package
        run: pip install "$(ls dist/*.whl)[subscriptions]" ${{ matrix.deps }}

      - name: Run tests
        run: python -m unittest discover -s tests -v
